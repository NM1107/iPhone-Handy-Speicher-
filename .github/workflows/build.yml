name: iPhone-App bauen

on:
  push:
    branches: [main]
    paths-ignore:
      - "pc-app/**"
      - ".github/workflows/pc-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen (unsigniert – Sideloadly signiert beim Installieren)
        run: |
          set -o pipefail
          xcodebuild \
            -project GalerieAufraeumer.xcodeproj \
            -scheme GalerieAufraeumer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error|warning: |BUILD" || true
          test -d build/Build/Products/Release-iphoneos/GalerieAufraeumer.app || (tail -80 build.log; exit 1)

      - name: IPA-Datei packen
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GalerieAufraeumer.app Payload/
          zip -qry GalerieAufraeumer.ipa Payload
          ls -lh GalerieAufraeumer.ipa

      - name: IPA hochladen
        uses: actions/upload-artifact@v4
        with:
          name: GalerieAufraeumer-ipa
          path: GalerieAufraeumer.ipa

      - name: Als Release veröffentlichen (einfacher Download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Galerie aufräumen – Build ${{ github.run_number }}
          files: GalerieAufraeumer.ipa
