name: GalerieAufraeumer
options:
  bundleIdPrefix: de.nevio
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  GalerieAufraeumer:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Aufräumen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: Die App zeigt dir deine Fotos und Videos einzeln an, damit du entscheiden kannst, was du behältst und was gelöscht wird.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nevio.galerieaufraeumer
        PRODUCT_NAME: GalerieAufraeumer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
