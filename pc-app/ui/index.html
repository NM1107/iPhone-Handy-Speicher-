<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>PC aufräumen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#0B0E13; --panel:#121821; --panel2:#161E29; --line:#222A35; --line2:#2E3846;
  --text:#E6EDF3; --muted:#A8B3C2; --green:#4ADE80; --green-ink:#06210F; --red:#C8302A; --red-line:#7A1A22;
  --amber:#FBBF24; --blue:#7CC4FF;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit}
a{color:var(--blue)}
.hidden{display:none !important}
.app{min-height:100%;display:flex;flex-direction:column}

/* Kopfzeile */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line);background:#10141B;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:17px}
.logo{width:34px;height:34px;border-radius:9px;background:#1E2632;display:flex;align-items:center;justify-content:center}
.disks{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:13px;color:var(--muted);background:#161C25;border:1px solid var(--line2);border-radius:999px;padding:6px 12px}
.chip b{color:var(--text)}
.chip.low b{color:#FF8A80}

.btn{border:1px solid var(--line2);background:#1E2632;color:var(--text);border-radius:12px;padding:10px 16px;min-height:44px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:#26303D}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--green);color:var(--green-ink);border:none;font-weight:800}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{background:var(--red);color:#fff;border:none;font-weight:800}
.btn.danger:hover{filter:brightness(1.08)}
.btn.big{font-size:18px;padding:16px 28px;min-height:58px;border-radius:14px}
.btn.ghost{background:transparent}

main{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:24px 24px 32px}
h1{margin:0;font-size:34px;font-weight:800;letter-spacing:-.4px}
h2{margin:0;font-size:20px;font-weight:700}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}

/* Start */
.hero{display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.step{display:flex;gap:14px;align-items:flex-start}
.num{width:34px;height:34px;flex-shrink:0;border-radius:50%;background:#1E2632;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--green)}
.safe{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted);line-height:1.5}

/* Laufwerk */
.bar{display:flex;height:20px;border-radius:10px;overflow:hidden;background:#0B0E13;gap:2px}
.bar>div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Scan */
.spinner{width:56px;height:56px;border-radius:50%;border:5px solid #222A35;border-top-color:var(--green);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.phases{display:flex;flex-direction:column;gap:10px}
.phase{display:flex;align-items:center;gap:12px;color:var(--muted)}
.phase.active{color:var(--text);font-weight:600}
.phase.ok{color:var(--green)}
.pdot{width:12px;height:12px;border-radius:50%;background:#2E3846;flex-shrink:0}
.phase.active .pdot{background:var(--amber)}
.phase.ok .pdot{background:var(--green)}
.path{font-family:Consolas,"Cascadia Mono",ui-monospace,monospace;font-size:13px;color:var(--muted);word-break:break-all}

/* Datenmüll */
.junk{background:#0F2418;border:1px solid #1F5A35;border-radius:20px;padding:22px 26px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.junk details{margin-top:6px;font-size:14px;color:#A8D9B5}
.junk summary{cursor:pointer}
.junk ul{margin:8px 0 0;padding-left:18px;line-height:1.7}

/* Kategorien */
.cat{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;text-align:left;cursor:pointer;transition:border-color .15s, transform .15s}
.cat:hover:not(:disabled){border-color:#3A4656;transform:translateY(-1px)}
.cat:disabled{cursor:default;opacity:.55}
.cat .size{font-size:26px;font-weight:800}
.cat .title{font-size:17px;font-weight:700}
.cat .text{font-size:14px;color:var(--muted);line-height:1.45}
.badge{font-size:12px;font-weight:800;color:var(--green-ink);background:var(--green);border-radius:999px;padding:3px 9px;margin-left:8px;vertical-align:2px}
.cat .go{margin-top:auto;font-weight:700;color:var(--text);background:#1E2632;border:1px solid var(--line2);border-radius:10px;padding:11px;text-align:center}
.icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center}

/* Durchschauen */
.review{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}
.review .mainc{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:14px}
.review .side{flex:1 1 290px;display:flex;flex-direction:column;gap:14px}
.preview{height:clamp(220px,calc(100vh - 560px),560px);display:flex;align-items:center;justify-content:center;background:#0D1117;position:relative;overflow:hidden}
.preview img,.preview video{max-width:100%;max-height:100%;object-fit:contain}
.preview iframe{width:100%;height:100%;border:0;background:#fff}
.preview .textbox{width:78%;max-height:90%;overflow:auto;background:#F4F1EA;color:#1F2328;border-radius:10px;padding:22px 26px;font-family:Consolas,"Cascadia Mono",monospace;font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.tile{width:136px;height:168px;border:2px solid #3A4656;background:#1B2430;border-radius:14px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:22px;font-size:26px;font-weight:800}
.ftype{display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--muted);text-align:center;padding:0 20px}
.info{padding:16px 22px;display:flex;flex-direction:column;gap:12px}
.fname{font-size:21px;font-weight:700;word-break:break-all}
.fsize{font-size:26px;font-weight:800;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px 22px;font-size:14px}
.facts span:first-child{display:block;color:var(--muted);margin-bottom:2px}
.verdict{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid #263142;border-radius:14px;padding:13px 16px;font-size:14px;line-height:1.5;color:#D5DCE6}
.pill{flex-shrink:0;font-size:13px;font-weight:800;border-radius:999px;padding:4px 10px}
.pill.go{background:var(--green);color:var(--green-ink)}
.pill.check{background:var(--amber);color:#2A1C00}
.decide{display:flex;gap:12px;padding:12px;border:2px solid var(--red-line);border-radius:22px}
.decide button{flex:1;min-height:72px;border:none;border-radius:14px;font-size:21px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.decide .k{background:var(--green);color:var(--green-ink)}
.decide .d{background:var(--red);color:#fff}
.decide small{font-size:12px;font-weight:600;opacity:.8}
.decide button:active{transform:scale(.98)}
.nextlist div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #1E2632;font-size:14px}
.nextlist div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#D5DCE6}
.kv{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.progress{height:6px;border-radius:4px;background:#222A35;overflow:hidden;width:260px;max-width:100%}
.progress>div{height:100%;background:var(--green);border-radius:4px;transition:width .2s}
.flash{animation:flash .25s ease}
@keyframes flash{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}

/* Zusammenfassung */
.list{display:flex;flex-direction:column;max-height:320px;overflow:auto;border-top:1px solid var(--line)}
.list .li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #1A212B;font-size:14px}
.list .li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);background:transparent;cursor:pointer;color:var(--muted)}
.x:hover{color:var(--text);background:#1E2632}

/* Dialog + Hinweis */
.overlay{position:fixed;inset:0;background:rgba(5,7,10,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.dialog{max-width:520px;width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E2632;border:1px solid var(--line2);border-radius:12px;padding:12px 18px;z-index:60;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4)}
kbd{font-family:inherit;font-size:12px;background:#1E2632;border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
@media (max-width:700px){h1{font-size:26px} main{padding:18px 14px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div>
      PC aufräumen
    </div>
    <div class="disks" id="disks"></div>
  </header>
  <main id="view"></main>
</div>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const S = {
  screen: "start", state: null, cats: [], junk: null,
  cat: null, items: [], pos: 0, history: [],
  marked: new Map(),        // id -> item (zum Löschen/Deinstallieren)
  keptSession: 0, freedTotal: 0, busy: false, lastPhase: "",
};
const $ = (sel) => document.querySelector(sel);
const view = () => $("#view");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function fmt(n){
  if (n >= 1073741824) return (n/1073741824).toFixed(1).replace(".", ",") + " GB";
  if (n >= 1048576) return Math.round(n/1048576) + " MB";
  if (n >= 1024) return Math.round(n/1024) + " KB";
  if (!n) return "0 MB";
  return n + " Byte";
}

async function api(path, body){
  const opts = {headers: {"X-Token": TOKEN}};
  if (body !== undefined){ opts.method = "POST"; opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
const fileUrl = (id) => `/api/file?id=${id}&t=${encodeURIComponent(TOKEN)}`;

function toast(text){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

function confirmBox({title, text, ok = "OK", cancel = "Abbrechen", danger = false}){
  return new Promise((resolve) => {
    const ov = document.createElement("div");
    ov.className = "overlay";
    ov.innerHTML = `<div class="dialog" role="dialog" aria-modal="true">
      <h2>${esc(title)}</h2><div class="muted" style="line-height:1.55">${text}</div>
      <div class="row" style="justify-content:flex-end;margin-top:6px">
        ${cancel ? `<button class="btn" data-a="0">${esc(cancel)}</button>` : ""}
        <button class="btn ${danger ? "danger" : "primary"}" data-a="1">${esc(ok)}</button>
      </div></div>`;
    ov.addEventListener("click", (e) => {
      const a = e.target.closest("[data-a]");
      if (a){ ov.remove(); resolve(a.dataset.a === "1"); }
    });
    document.body.appendChild(ov);
    ov.querySelector('[data-a="1"]').focus();
  });
}

/* ------------------------------------------------ Laufwerke oben */
function renderDisks(){
  const disks = (S.state && S.state.disks) || [];
  $("#disks").innerHTML = disks.map((d) => {
    const low = d.total && d.free / d.total < 0.08;
    const name = d.root.replace("\\", "");
    return `<span class="chip ${low ? "low" : ""}">${esc(name)} <b>${esc(d.freeText)}</b> frei von ${esc(d.totalText)}</span>`;
  }).join("");
}

async function refreshState(){
  S.state = await api("/api/state");
  if (S.state.categories) S.cats = S.state.categories;
  renderDisks();
  return S.state;
}

/* ------------------------------------------------ Start */
function renderStart(){
  S.screen = "start";
  const disks = (S.state && S.state.disks) || [];
  const free = disks.reduce((a, d) => a + d.free, 0);
  view().innerHTML = `<div class="stack">
    <section class="card hero">
      <span class="muted">${disks.length} Laufwerk${disks.length === 1 ? "" : "e"} · zusammen ${fmt(free)} frei</span>
      <h1>Platz schaffen – Datei für Datei</h1>
      <p class="muted" style="margin:0;max-width:760px;line-height:1.6;font-size:16px">Die App sucht auf deinem PC nach großen, doppelten und alten Dateien, nach Spielen und nach Datenmüll. Danach zeigt sie dir alles einzeln – du entscheidest: <b style="color:var(--green)">Behalten</b> oder <b style="color:#FF8A80">Löschen</b>.</p>
      <button class="btn primary big" id="scan">PC jetzt scannen</button>
      <span class="muted" style="font-size:13px">Dauert meist 1–5 Minuten. Es wird dabei noch nichts gelöscht.</span>
    </section>
    <section class="steps">
      <div class="card step"><div class="num">1</div><div><b>Scannen</b><div class="muted" style="margin-top:4px;line-height:1.5">Alle Laufwerke werden durchsucht und sortiert.</div></div></div>
      <div class="card step"><div class="num">2</div><div><b>Durchschauen</b><div class="muted" style="margin-top:4px;line-height:1.5">Jede Datei groß – mit Vorschau und einem Tipp, ob sie weg kann.</div></div></div>
      <div class="card step"><div class="num">3</div><div><b>Frei machen</b><div class="muted" style="margin-top:4px;line-height:1.5">Am Ende alles mit einem Klick – vorher siehst du die Liste nochmal.</div></div></div>
    </section>
    ${safetyNote()}
  </div>`;
  $("#scan").onclick = startScan;
}

function safetyNote(){
  return `<div class="safe"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A8B3C2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-top:2px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    <span>Sicher: Windows, Programmdateien, Treiber und Spieldateien werden nie einzeln angezeigt. Spiele entfernst du nur komplett über das normale Windows-Deinstallieren. Gelöschte Dateien landen erst im Papierkorb.</span></div>`;
}

/* ------------------------------------------------ Scan */
let pollTimer = null;
async function startScan(){
  S.marked.clear(); S.history = []; S.keptSession = 0; S.junk = null;
  await api("/api/scan", {});
  renderScanning();
  loadJunk(false);
  pollScan();
}

function pollScan(){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    try { await refreshState(); } catch (e) { /* weiter versuchen */ }
    const st = S.state;
    const changed = st.phase !== S.lastPhase;
    S.lastPhase = st.phase;
    if (st.phase === "done" || st.phase === "error"){
      if (st.phase === "error") toast("Beim Scannen gab es ein Problem: " + st.error);
      if (S.screen === "scanning" || S.screen === "overview") renderOverview();
      else if (st.phase === "done") toast("Doppelte Dateien sind jetzt auch fertig.");
      return;
    }
    if (S.screen === "scanning") renderScanning();
    else if (S.screen === "overview" && changed) renderOverview();
    pollScan();
  }, 700);
}

function renderScanning(){
  S.screen = "scanning";
  const st = S.state || {phase: "programs", filesSeen: 0, bytesText: "0 Byte", current: ""};
  const order = ["programs", "files", "duplicates"];
  const idx = order.indexOf(st.phase);
  const ph = (i, label) => `<div class="phase ${idx > i || st.phase === "done" ? "ok" : idx === i ? "active" : ""}"><span class="pdot"></span>${label}</div>`;
  const dupPct = Math.round((st.dupProgress || 0) * 100);
  view().innerHTML = `<div class="stack" style="max-width:760px;margin:0 auto">
    <section class="card stack" style="align-items:flex-start">
      <div class="row"><div class="spinner" aria-hidden="true"></div>
        <div><h1 style="font-size:28px">Dein PC wird durchsucht …</h1><div class="muted" style="margin-top:4px">Noch wird nichts gelöscht.</div></div></div>
      <div class="phases">
        ${ph(0, "Spiele & Programme finden")}
        ${ph(1, `Dateien durchsuchen · ${Number(st.filesSeen).toLocaleString("de-DE")} Dateien, ${esc(st.bytesText)}`)}
        ${ph(2, `Doppelte Dateien vergleichen${st.phase === "duplicates" ? ` · ${dupPct} %` : ""}`)}
      </div>
      <div class="path">${esc(st.current || "")}</div>
      ${st.phase === "duplicates" ? `<button class="btn" id="early">Schon mal anfangen (Doppelte kommen gleich dazu)</button>` : ""}
    </section>
  </div>`;
  const early = $("#early");
  if (early) early.onclick = () => renderOverview();
}

/* ------------------------------------------------ Datenmüll */
async function loadJunk(refresh){
  try {
    S.junk = await api("/api/junk" + (refresh ? "?refresh=1" : ""));
  } catch (e) { S.junk = null; }
  if (S.screen === "overview") renderOverview();
}

function junkHtml(){
  if (!S.junk) return `<section class="junk"><div class="row"><div class="spinner" style="width:28px;height:28px;border-width:4px"></div><span>Datenmüll wird gemessen …</span></div></section>`;
  const j = S.junk;
  const groups = j.groups.filter((g) => g.size > 0);
  return `<section class="junk">
    <div style="flex:1 1 520px;display:flex;gap:18px;align-items:flex-start">
      <div class="icon" style="background:#14361F;width:56px;height:56px;border-radius:16px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg></div>
      <div>
        <div style="font-size:20px;font-weight:700">Schnell-Aufräumen: ${esc(j.totalText)} Datenmüll</div>
        <div style="font-size:14px;color:#A8D9B5;margin-top:4px;line-height:1.5">Temporäre Dateien, Caches, Update-Reste und der Papierkorb. Nichts davon brauchst du – Windows legt es bei Bedarf neu an.</div>
        ${groups.length ? `<details><summary>Was genau?</summary><ul>${groups.map((g) => `<li>${esc(g.title)}: ${esc(g.sizeText)}</li>`).join("")}</ul></details>` : ""}
        ${j.needsAdmin ? `<div style="font-size:13px;color:#A8D9B5;margin-top:8px">Manche Windows-Ordner brauchen Administrator-Rechte. <button class="btn ghost" id="admin" style="min-height:32px;padding:4px 10px;font-size:13px">Als Administrator neu starten</button></div>` : ""}
      </div>
    </div>
    <button class="btn primary big" id="junkgo" ${j.total > 0 ? "" : "disabled"}>${j.total > 0 ? esc(j.totalText) + " jetzt frei machen" : "Alles sauber"}</button>
  </section>`;
}

async function cleanJunk(){
  const ok = await confirmBox({title: "Datenmüll löschen?", text: `Es werden etwa <b>${esc(S.junk.totalText)}</b> temporäre Dateien, Caches und der Papierkorb gelöscht. Dateien, die gerade benutzt werden, bleiben einfach liegen.<br><br>Tipp: Browser und Spiele vorher schließen, dann wird mehr frei.`, ok: "Jetzt frei machen"});
  if (!ok) return;
  const btn = $("#junkgo"); btn.disabled = true; btn.textContent = "Wird gelöscht …";
  const res = await api("/api/junk/clean", {});
  S.freedTotal += res.freed;
  toast(`${res.freedText} frei gemacht`);
  await refreshState();
  loadJunk(true);
}

/* ------------------------------------------------ Übersicht */
const CAT_ICONS = {
  programs: ["#231A3D", "#A78BFA", '<rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M16 12h.01M18 14h.01"/>'],
  big: ["#142640", "#60A5FA", '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/>'],
  downloads: ["#3A2A0E", "#FBBF24", '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>'],
  media: ["#3A1430", "#F472B6", '<rect x="2" y="5" width="15" height="14" rx="2"/><path d="m17 10 5-3v10l-5-3"/>'],
  duplicates: ["#0F3330", "#2DD4BF", '<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>'],
  old: ["#23262B", "#CBD5E1", '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
};
const plural = (n, one, many) => `${Number(n).toLocaleString("de-DE")} ${n === 1 ? one : many}`;
const icon = (id, size = 22) => { const [bg, c, p] = CAT_ICONS[id]; return `<div class="icon" style="background:${bg}"><svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg></div>`; };

function renderOverview(){
  S.screen = "overview";
  const st = S.state || {};
  const disks = st.disks || [];
  const cats = S.cats || [];
  const stillDup = st.phase === "duplicates";
  const markedSize = [...S.marked.values()].reduce((a, i) => a + i.size, 0);
  const main = disks[0];
  const diskCards = disks.map((d) => {
    const used = Math.max(d.total - d.free, 0);
    const pctFree = d.total ? (d.free / d.total) * 100 : 0;
    return `<div style="display:flex;flex-direction:column;gap:8px">
      <div class="row" style="justify-content:space-between"><b>${esc(d.root.replace("\\", ""))} ${esc(d.label || "")}</b><span class="muted">${esc(d.freeText)} frei von ${esc(d.totalText)}</span></div>
      <div class="bar"><div style="flex:${used};background:#3B4A5E"></div><div style="flex:${d.free};background:${pctFree < 8 ? "#FF6B5E" : "#4ADE80"}"></div></div>
    </div>`;
  }).join("");
  const biggest = cats.filter((c) => c.count > 0).reduce((a, c) => (!a || c.size > a.size ? c : a), null);
  const freeHead = main ? `Auf ${esc(main.root.replace("\\", ""))} sind <span style="color:${main.free / main.total < 0.08 ? "#FF6B5E" : "#4ADE80"}">${esc(main.freeText)}</span> frei` : "Übersicht";

  view().innerHTML = `<div class="stack">
    <section class="card stack" style="gap:16px">
      <div class="row" style="justify-content:space-between;align-items:flex-end">
        <h1>${freeHead}</h1>
        <div class="row">
          ${S.marked.size ? `<button class="btn danger" id="tosum">${S.marked.size} markiert · ${fmt(markedSize)} → weiter</button>` : ""}
          <button class="btn" id="rescan" ${st.running ? "disabled" : ""}>Neu scannen</button>
        </div>
      </div>
      ${diskCards}
    </section>
    ${junkHtml()}
    <div class="stack" style="gap:12px">
      <h2>Selbst durchschauen – eins nach dem anderen</h2>
      <span class="muted" style="margin-top:-4px">Tipp: Fang mit der Kategorie an, wo am meisten Platz drinsteckt. Du kannst jederzeit aufhören.</span>
      <div class="grid">
        ${cats.map((c) => {
          const waiting = c.id === "duplicates" && stillDup;
          const empty = !waiting && c.count === 0;
          return `<button class="cat" data-cat="${c.id}" ${waiting || empty ? "disabled" : ""}>
            <div class="row" style="justify-content:space-between;width:100%">${icon(c.id)}<span class="size">${waiting ? "…" : empty ? "–" : esc(c.sizeText)}</span></div>
            <span class="title">${esc(c.title)}${biggest && biggest.id === c.id && !waiting ? `<span class="badge">Am meisten Platz</span>` : ""}</span>
            <span class="text">${waiting ? "Wird gerade verglichen …" : `${c.id === "programs" ? plural(c.count, "Stück", "Stück") : plural(c.count, "Datei", "Dateien")} · ${esc(c.text)}`}</span>
            <span class="go">${empty ? "Nichts gefunden" : waiting ? "Gleich fertig" : "Durchschauen →"}</span>
          </button>`;
        }).join("")}
      </div>
    </div>
    ${safetyNote()}
  </div>`;
  view().querySelectorAll("[data-cat]").forEach((b) => b.onclick = () => openCategory(b.dataset.cat));
  $("#rescan").onclick = async () => {
    if (S.marked.size && !(await confirmBox({title: "Neu scannen?", text: "Deine Markierungen zum Löschen gehen dabei verloren. Behaltene Dateien bleiben gemerkt.", ok: "Neu scannen"}))) return;
    startScan();
  };
  const ts = $("#tosum"); if (ts) ts.onclick = renderSummary;
  const jg = $("#junkgo"); if (jg) jg.onclick = cleanJunk;
  const ad = $("#admin"); if (ad) ad.onclick = async () => {
    if (await confirmBox({title: "Mit Administrator-Rechten neu starten?", text: "Windows fragt gleich nach der Erlaubnis. Danach startet die App neu und kann auch die Windows-Ordner aufräumen. Du musst dann einmal neu scannen.", ok: "Neu starten"})) {
      const r = await api("/api/admin", {});
      if (!r.ok) toast("Hat nicht geklappt – Erlaubnis wurde nicht gegeben.");
    }
  };
}

/* ------------------------------------------------ Durchschauen */
async function openCategory(id){
  S.cat = (S.cats || []).find((c) => c.id === id);
  view().innerHTML = `<div class="card row"><div class="spinner" style="width:28px;height:28px;border-width:4px"></div>Wird geladen …</div>`;
  const data = await api("/api/items?cat=" + encodeURIComponent(id));
  S.items = data.items.filter((i) => !S.marked.has(i.id));
  S.pos = 0; S.history = [];
  renderReview();
}

function previewHtml(it){
  if (it.kind === "program") return `<div class="ftype"><div class="icon" style="width:120px;height:120px;border-radius:28px;background:#2B1F4D"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#C4B5FD" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M16 12h.01M18 14h.01"/></svg></div><b style="font-size:24px;color:var(--text)">${esc(it.name)}</b><span>Spiel / Programm – wird über Windows deinstalliert</span></div>`;
  const ext = "." + (it.ext || "").toLowerCase();
  if (it.kind === "image" && [".jpg",".jpeg",".png",".gif",".bmp",".webp",".avif"].includes(ext)) return `<img src="${fileUrl(it.id)}" alt="Vorschau von ${esc(it.name)}">`;
  if (it.kind === "video" && [".mp4",".webm",".m4v",".mov"].includes(ext)) return `<video src="${fileUrl(it.id)}" controls autoplay muted playsinline preload="metadata"></video>`;
  if (it.kind === "audio") return `<div class="ftype"><div class="tile" style="color:#F472B6">${esc(it.ext)}</div><audio src="${fileUrl(it.id)}" controls></audio></div>`;
  if (it.kind === "pdf") return `<iframe src="${fileUrl(it.id)}#toolbar=0&view=FitH" title="PDF-Vorschau"></iframe>`;
  if (it.kind === "text") return `<div class="textbox" id="textprev">Wird geladen …</div>`;
  const colors = {ISO:"#60A5FA",ZIP:"#FBBF24",RAR:"#FBBF24","7Z":"#FBBF24",EXE:"#7DD3FC",MSI:"#7DD3FC"};
  const extra = it.kind === "video" || it.kind === "image" ? "Keine Vorschau für dieses Format – mit „Öffnen“ ansehen." : esc(it.typeLabel);
  return `<div class="ftype"><div class="tile" style="color:${colors[it.ext] || "#CBD5E1"}">${esc(it.ext || "?")}</div><span>${extra}</span></div>`;
}

function renderReview(){
  S.screen = "review";
  const it = S.items[S.pos];
  const total = S.items.length;
  const markedSize = [...S.marked.values()].reduce((a, i) => a + i.size, 0);
  const catMarked = [...S.marked.values()].filter((m) => m._cat === S.cat.id);
  const pct = total ? Math.round((S.pos / total) * 100) : 100;
  const head = `<div class="row" style="justify-content:space-between;margin-bottom:18px">
      <div class="row">
        <button class="btn" id="back">← Übersicht</button>
        <div><div style="font-weight:700;font-size:17px">${esc(S.cat.title)} · ${Math.min(S.pos + 1, total)} von ${total.toLocaleString("de-DE")}</div>
        <div class="progress" style="margin-top:6px"><div style="width:${pct}%"></div></div></div>
      </div>
      <div class="row">
        <button class="btn" id="undo" ${S.history.length ? "" : "disabled"} title="Strg+Z"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Rückgängig</button>
        <button class="btn danger" id="tosum" ${S.marked.size ? "" : "disabled"}>${S.marked.size} markiert · ${fmt(markedSize)} → weiter</button>
      </div>
    </div>`;

  if (!it){
    view().innerHTML = head + `<div class="card stack" style="align-items:center;text-align:center;padding:56px 24px">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>
      <h1 style="font-size:28px">${esc(S.cat.title)}: alles durchgeschaut</h1>
      <span class="muted" style="font-size:16px">${plural(catMarked.length, "Datei", "Dateien")} markiert (${fmt(catMarked.reduce((a, i) => a + i.size, 0))}) · insgesamt ${S.marked.size} markiert</span>
      <div class="row" style="justify-content:center">
        <button class="btn" id="back2">Andere Kategorie</button>
        <button class="btn danger big" id="tosum2" ${S.marked.size ? "" : "disabled"}>Weiter zum Frei machen</button>
      </div></div>`;
    bindReviewHead();
    $("#back2").onclick = () => { backToOverview(); };
    $("#tosum2").onclick = renderSummary;
    return;
  }

  const next = S.items.slice(S.pos + 1, S.pos + 6);
  const isProg = it.type === "program";
  view().innerHTML = head + `<div class="review">
    <div class="mainc">
      <div class="card flash" style="padding:0;overflow:hidden">
        <div class="preview">${previewHtml(it)}</div>
        <div class="info">
          <div class="row" style="justify-content:space-between;align-items:flex-start"><span class="fname">${esc(it.name)}</span><span class="fsize">${esc(it.sizeText)}</span></div>
          <div class="facts">
            <div><span>Ort</span><span class="path" style="color:var(--text)">${esc(it.folder || "–")}</span></div>
            <div><span>${isProg ? "Installiert" : "Zuletzt geändert"}</span>${esc(it.modified)}</div>
            <div><span>Art</span>${esc(it.typeLabel)}</div>
          </div>
          <div class="verdict"><span class="pill ${it.verdict}">${it.verdict === "go" ? "Kann weg" : "Selbst prüfen"}</span><span style="flex:1">${esc(it.hint)}</span>
            <span class="row" style="gap:8px;flex-wrap:nowrap">
              ${!isProg ? `<button class="btn" id="open" style="min-height:36px;padding:6px 12px">Öffnen</button>` : ""}
              ${it.folder ? `<button class="btn" id="reveal" style="min-height:36px;padding:6px 12px">Im Ordner zeigen</button>` : ""}
            </span></div>
        </div>
      </div>
      <div class="muted" style="font-size:13px;text-align:center;margin-bottom:-6px">Nichts wird sofort gelöscht – am Ende siehst du alles nochmal.</div>
      <div class="decide">
        <button class="k" id="keep">✓ Behalten<small>Taste ←</small></button>
        <button class="d" id="del">${isProg ? "Deinstallieren" : "Löschen"}<small>Taste →</small></button>
      </div>
    </div>
    <div class="side">
      <div class="card nextlist" style="padding:18px"><b>Als Nächstes</b>
        ${next.length ? next.map((n) => `<div><span>${esc(n.name)}</span><span class="muted">${esc(n.sizeText)}</span></div>`).join("") : `<div class="muted" style="border:none">Das ist die letzte.</div>`}
      </div>
      <div class="card" style="padding:18px"><b>In dieser Kategorie</b>
        <div class="kv" style="margin-top:8px"><span class="muted">Zum Löschen markiert</span><b style="color:#FF8A80">${catMarked.length}</b></div>
        <div class="kv"><span class="muted">Wird frei</span><b>${fmt(catMarked.reduce((a, i) => a + i.size, 0))}</b></div>
        <div class="kv"><span class="muted">Noch übrig</span><b>${(total - S.pos).toLocaleString("de-DE")}</b></div>
      </div>
      <div class="card muted" style="padding:18px;font-size:13px;line-height:1.7"><b style="color:var(--text)">Tastatur</b><br><kbd>←</kbd> Behalten · <kbd>→</kbd> Löschen<br><kbd>Strg</kbd>+<kbd>Z</kbd> Rückgängig · <kbd>Esc</kbd> Übersicht<br>Du kannst jederzeit aufhören – Behaltenes merkt sich die App.</div>
    </div>
  </div>`;
  bindReviewHead();
  $("#keep").onclick = () => decide(false);
  $("#del").onclick = () => decide(true);
  const op = $("#open"); if (op) op.onclick = () => api("/api/open", {id: it.id});
  const rv = $("#reveal"); if (rv) rv.onclick = () => api("/api/reveal", {id: it.id});
  if (it.kind === "text"){
    api("/api/text?id=" + it.id).then((d) => { const el = $("#textprev"); if (el) el.textContent = d.text || "(leer)"; })
      .catch(() => { const el = $("#textprev"); if (el) el.textContent = "Vorschau nicht möglich."; });
  }
}

function bindReviewHead(){
  $("#back").onclick = backToOverview;
  $("#undo").onclick = undo;
  $("#tosum").onclick = renderSummary;
}

async function backToOverview(){
  stopMedia();
  renderOverview();
  try { await refreshState(); renderOverview(); } catch (e) {}
}

function stopMedia(){ document.querySelectorAll("video,audio").forEach((m) => { try { m.pause(); m.removeAttribute("src"); m.load(); } catch (e) {} }); }

async function decide(del){
  if (S.busy) return;
  const it = S.items[S.pos];
  if (!it) return;
  S.busy = true;
  stopMedia();
  try {
    if (del){ S.marked.set(it.id, {...it, _cat: S.cat.id}); }
    else { S.keptSession++; api("/api/keep", {id: it.id}).catch(() => {}); }
    S.history.push({id: it.id, del});
    S.pos++;
    renderReview();
  } finally { S.busy = false; }
}

function undo(){
  const last = S.history.pop();
  if (!last) return;
  stopMedia();
  if (last.del) S.marked.delete(last.id);
  else { S.keptSession--; api("/api/unkeep", {id: last.id}).catch(() => {}); }
  const idx = S.items.findIndex((i) => i.id === last.id);
  if (idx >= 0) S.pos = idx;
  renderReview();
}

document.addEventListener("keydown", (e) => {
  if (document.querySelector(".overlay")) return;
  if (S.screen !== "review") return;
  if (e.target && ["INPUT","TEXTAREA"].includes(e.target.tagName)) return;
  if (e.key === "ArrowLeft"){ e.preventDefault(); decide(false); }
  else if (e.key === "ArrowRight"){ e.preventDefault(); decide(true); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){ e.preventDefault(); undo(); }
  else if (e.key === "Escape"){ backToOverview(); }
});

/* ------------------------------------------------ Zusammenfassung */
function renderSummary(){
  stopMedia();
  S.screen = "summary";
  const all = [...S.marked.values()];
  const progs = all.filter((i) => i.type === "program");
  const files = all.filter((i) => i.type === "file");
  const pSize = progs.reduce((a, i) => a + i.size, 0);
  const fSize = files.reduce((a, i) => a + i.size, 0);
  const disk = (S.state && S.state.disks && S.state.disks[0]) || null;
  const li = (i) => `<div class="li"><span class="n" title="${esc(i.folder)}">${esc(i.name)}</span><span class="muted">${esc(i.sizeText)}</span><button class="x" data-rm="${i.id}" aria-label="${esc(i.name)} doch behalten" title="Doch behalten">✕</button></div>`;
  view().innerHTML = `<div class="stack" style="max-width:1000px;margin:0 auto">
    <div class="row"><button class="btn" id="back">← Zurück</button></div>
    <div><h1>Du machst <span style="color:var(--green)">${fmt(pSize + fSize)}</span> frei</h1>
      <div class="muted" style="margin-top:6px;font-size:16px">Schau nochmal drüber. Mit ✕ nimmst du etwas wieder raus.</div></div>
    ${disk ? `<section class="card stack" style="gap:14px">
      <div><div class="kv"><span class="muted">Jetzt frei auf ${esc(disk.root.replace("\\",""))}</span><b>${esc(disk.freeText)}</b></div>
        <div class="bar" style="height:14px"><div style="flex:${disk.free};background:#FF6B5E"></div><div style="flex:${Math.max(disk.total - disk.free, 0)};background:#222A35"></div></div></div>
      <div><div class="kv"><span class="muted">Danach ungefähr</span><b style="color:var(--green)">${fmt(disk.free + pSize + fSize)}</b></div>
        <div class="bar" style="height:14px"><div style="flex:${disk.free + pSize + fSize};background:#4ADE80"></div><div style="flex:${Math.max(disk.total - disk.free - pSize - fSize, 0)};background:#222A35"></div></div></div>
    </section>` : ""}
    <section class="grid">
      <div class="card stack" style="gap:10px"><span class="muted">Wird deinstalliert</span><span style="font-size:24px;font-weight:800">${plural(progs.length, "Spiel/Programm", "Spiele/Programme")} · ${fmt(pSize)}</span>
        <span class="muted" style="font-size:14px;line-height:1.5">Für jedes öffnet sich nacheinander das normale Deinstallations-Fenster – dort einfach bestätigen.</span>
        <div class="list">${progs.map(li).join("") || `<div class="li muted">Keine</div>`}</div></div>
      <div class="card stack" style="gap:10px"><span class="muted">Kommt in den Papierkorb</span><span style="font-size:24px;font-weight:800">${plural(files.length, "Datei", "Dateien")} · ${fmt(fSize)}</span>
        <span class="muted" style="font-size:14px;line-height:1.5">Bis du den Papierkorb leerst, kannst du alles zurückholen.</span>
        <div class="list">${files.map(li).join("") || `<div class="li muted">Keine</div>`}</div></div>
    </section>
    <section class="stack" style="gap:12px;padding:12px;border:2px solid var(--red-line);border-radius:22px">
      <button class="btn danger big" id="go" ${all.length ? "" : "disabled"}>${fmt(pSize + fSize)} jetzt frei machen</button>
      <div class="row"><button class="btn" id="more" style="flex:1">Weiter durchschauen</button><button class="btn" id="cancel" style="flex:1">Alle Markierungen verwerfen</button></div>
    </section>
    <div class="safe"><span>ℹ️</span><span>Wichtig: Wirklich frei wird der Platz erst, wenn der Papierkorb geleert ist – das fragt dich die App gleich danach.</span></div>
  </div>`;
  $("#back").onclick = () => S.cat ? renderReview() : renderOverview();
  $("#more").onclick = backToOverview;
  $("#cancel").onclick = async () => {
    if (await confirmBox({title: "Alle Markierungen verwerfen?", text: "Es wird nichts gelöscht. Die Dateien tauchen beim Durchschauen wieder auf.", ok: "Verwerfen"})) { S.marked.clear(); backToOverview(); }
  };
  view().querySelectorAll("[data-rm]").forEach((b) => b.onclick = () => {
    const id = Number(b.dataset.rm);
    const item = S.marked.get(id);
    S.marked.delete(id);
    if (item && S.cat && item._cat === S.cat.id && !S.items.some((i) => i.id === id)) S.items.splice(S.pos, 0, item);
    renderSummary();
  });
  $("#go").onclick = execute;
}

async function execute(){
  const all = [...S.marked.values()];
  const progs = all.filter((i) => i.type === "program");
  const files = all.filter((i) => i.type === "file");
  const ok = await confirmBox({title: "Jetzt frei machen?",
    text: `${files.length ? `<b>${plural(files.length, "Datei", "Dateien")}</b> ${files.length === 1 ? "kommt" : "kommen"} in den Papierkorb.<br>` : ""}${progs.length ? `<b>${plural(progs.length, "Spiel/Programm", "Spiele/Programme")}</b> werden nacheinander deinstalliert – bestätige jeweils das Fenster, das aufgeht.` : ""}`,
    ok: "Ja, los geht's", danger: true});
  if (!ok) return;
  view().innerHTML = `<div class="card stack" style="max-width:760px;margin:0 auto;align-items:flex-start"><div class="row"><div class="spinner"></div><h1 style="font-size:26px" id="work">Dateien kommen in den Papierkorb …</h1></div><div class="muted" id="workinfo"></div></div>`;
  let failed = [];
  let freedFiles = 0;
  if (files.length){
    // in Paketen, damit man den Fortschritt sieht
    for (let i = 0; i < files.length; i += 40){
      const chunk = files.slice(i, i + 40);
      $("#workinfo").textContent = `${Math.min(i + 40, files.length)} von ${files.length}`;
      const res = await api("/api/trash", {ids: chunk.map((f) => f.id)});
      res.done.forEach((id) => S.marked.delete(id));
      failed = failed.concat(res.failed);
      freedFiles += res.freed;
    }
  }
  let removedProgs = 0;
  let skippedNames = [];
  if (progs.length){
    $("#work").textContent = "Spiele & Programme werden deinstalliert …";
    // Knöpfe einmal anlegen (nicht bei jeder Aktualisierung neu)
    const box = document.createElement("div");
    box.className = "stack";
    box.style.gap = "10px";
    box.style.width = "100%";
    box.innerHTML = `<div class="row">
        <button class="btn" id="skipone" disabled>Überspringen – weiter zum nächsten</button>
        <button class="btn ghost" id="stopall">Alle restlichen abbrechen</button>
      </div>
      <span class="muted" style="font-size:13px;line-height:1.5">Hängt es, z. B. weil ein Launcher eine Anmeldung will? Dann einfach „Überspringen“. Das Spiel bleibt installiert und du kannst das offene Fenster selbst schließen.</span>`;
    $("#workinfo").after(box);
    let currentId = 0;
    $("#skipone").onclick = async () => {
      if (!currentId) return;
      $("#skipone").disabled = true;
      $("#skipone").textContent = "Wird übersprungen …";
      await api("/api/uninstall/skip", {id: currentId}).catch(() => {});
    };
    $("#stopall").onclick = async () => {
      if (!(await confirmBox({title: "Alle restlichen abbrechen?", text: "Das aktuelle und alle weiteren Spiele/Programme werden nicht deinstalliert. Sie bleiben einfach auf dem PC.", ok: "Abbrechen", cancel: "Weiter deinstallieren"}))) return;
      $("#stopall").disabled = true;
      $("#skipone").disabled = true;
      await api("/api/uninstall/stop", {}).catch(() => {});
    };
    await api("/api/uninstall", {ids: progs.map((p) => p.id)});
    while (true){
      await new Promise((r) => setTimeout(r, 1000));
      let st;
      try { st = await refreshState(); } catch (e) { continue; }
      const u = st.uninstall;
      if (u.currentId !== currentId){
        currentId = u.currentId;
        const sk = $("#skipone");
        if (sk){ sk.disabled = !currentId; sk.textContent = "Überspringen – weiter zum nächsten"; }
      }
      $("#workinfo").innerHTML = u.current ? `Gerade: <b>${esc(u.current)}</b> – bestätige das Deinstallations-Fenster.<br>Noch ${u.left} übrig.` : "";
      if (!u.running){
        removedProgs = u.done.length;
        u.done.forEach((id) => S.marked.delete(id));
        skippedNames = u.skipped.map((id) => (S.marked.get(id) || {}).name).filter(Boolean);
        box.remove();
        break;
      }
    }
  }
  const progFreed = progs.filter((p) => !S.marked.has(p.id)).reduce((a, p) => a + p.size, 0);
  const bin = await api("/api/bin", {});
  let binFreed = 0;
  let binEmpty = bin.size === 0;
  if (bin.size > 0){
    const empty = await confirmBox({title: "Papierkorb leeren?",
      text: `Im Papierkorb liegen jetzt <b>${esc(bin.sizeText)}</b>. Erst wenn er leer ist, ist der Platz wirklich frei.<br><br>Danach kannst du die Dateien nicht mehr zurückholen.`,
      ok: "Papierkorb leeren", cancel: "Später", danger: true});
    if (empty){ const r = await api("/api/bin/empty", {}); binFreed = r.freed; binEmpty = r.ok; }
  }
  await refreshState();
  S.freedTotal += freedFiles + progFreed;
  renderDone({freedFiles, progFreed, removedProgs, failed, binEmptied: binEmpty, progsTotal: progs.length, skippedNames});
}

function renderDone(r){
  S.screen = "done";
  const disk = (S.state && S.state.disks && S.state.disks[0]) || null;
  view().innerHTML = `<div class="stack" style="max-width:820px;margin:0 auto">
    <section class="card stack" style="align-items:center;text-align:center;padding:48px 24px">
      <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m8 12 3 3 5-6"/></svg>
      <h1>Fertig – ${fmt(r.freedFiles + r.progFreed)} aufgeräumt</h1>
      ${disk ? `<span style="font-size:18px">Jetzt frei auf ${esc(disk.root.replace("\\",""))}: <b style="color:var(--green)">${esc(disk.freeText)}</b></span>` : ""}
      ${!r.binEmptied ? `<span class="muted">Der Papierkorb ist noch voll – der Platz wird erst frei, wenn du ihn leerst.</span><button class="btn" id="emptybin">Papierkorb jetzt leeren</button>` : ""}
      ${r.progsTotal && r.removedProgs < r.progsTotal ? `<span class="muted" style="max-width:640px;line-height:1.5">Übersprungen oder abgebrochen – bleiben installiert: ${(r.skippedNames || []).length ? esc(r.skippedNames.join(", ")) : `${r.progsTotal - r.removedProgs} Programm(e)`}. Sie stehen weiter auf deiner Liste und du kannst es später nochmal versuchen.</span>` : ""}
      ${r.failed.length ? `<details style="text-align:left;max-width:100%"><summary class="muted">${r.failed.length} Datei(en) konnten nicht gelöscht werden</summary><ul class="muted">${r.failed.map((f) => `<li>${esc(f.name)} – ${esc(f.reason)}</li>`).join("")}</ul></details>` : ""}
      <div class="row" style="justify-content:center;margin-top:8px">
        <button class="btn primary big" id="again">Weiter aufräumen</button>
        <button class="btn big" id="quit">App schließen</button>
      </div>
    </section>
  </div>`;
  const eb = $("#emptybin");
  if (eb) eb.onclick = async () => {
    if (!(await confirmBox({title: "Papierkorb leeren?", text: "Danach kannst du die Dateien nicht mehr zurückholen.", ok: "Leeren", danger: true}))) return;
    const res = await api("/api/bin/empty", {});
    await refreshState();
    toast(res.ok ? `${res.freedText} endgültig frei` : "Papierkorb konnte nicht geleert werden");
    renderDone({...r, binEmptied: res.ok});
  };
  $("#again").onclick = async () => { S.marked.clear(); await refreshState(); renderOverview(); loadJunk(true); };
  $("#quit").onclick = async () => { try { await api("/api/quit", {}); } catch (e) {} window.close(); };
}

/* ------------------------------------------------ Start */
(async function init(){
  try {
    await refreshState();
  } catch (e) {
    view().innerHTML = `<div class="card">Die App konnte nicht starten. Bitte schließe das Fenster und öffne sie neu.</div>`;
    return;
  }
  if (S.state.phase === "done" || S.state.phase === "duplicates") { renderOverview(); loadJunk(false); }
  else if (S.state.running) { renderScanning(); pollScan(); }
  else renderStart();
  setInterval(() => { api("/api/ping", {}).catch(() => {}); }, 5000);
})();
</script>
</body>
